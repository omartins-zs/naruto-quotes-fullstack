name: naruto-quotes

services:
  api:
    build:
      context: ./naruto_api
    image: naruto-quotes-api:latest
    container_name: naruto_api
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3333
      API_DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-8}
    ports:
      - "${API_PORT:-3333}:3333"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3333/health', timeout=4).status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - naruto

  client:
    build:
      context: ./naruto-client
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: naruto-quotes-client:latest
    container_name: naruto_client
    restart: unless-stopped
    environment:
      NGINX_API_HOST: api
      NGINX_API_PORT: 3333
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - naruto

networks:
  naruto:
    driver: bridge
