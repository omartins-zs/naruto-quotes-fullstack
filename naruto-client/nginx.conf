# Template processado pelo entrypoint do nginx (envsubst) na subida do container.
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Encaminha /api/... para a API Flask, removendo o prefixo /api.
    location /api/ {
        proxy_pass         http://${NGINX_API_HOST}:${NGINX_API_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Assets com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota desconhecida cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
